[project]
name = "eve"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Noah Chalifour", email = "chalifournoah@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aegra-api>=0.10.3",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.11",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
eve = "eve:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires docker-compose.test.yml services",
    "live: hits the real LiteLLM proxy; requires EVE_LIVE_TESTS=1",
]
