[project]
name = "eve"
version = "0.7.0"
description = "Eve, a family personal assistant graph served by Aegra"
readme = "README.md"
authors = [
    { name = "Noah Chalifour", email = "chalifournoah@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aegra-api>=0.10.3",
    "aegra-cli>=0.10.3",
    "alembic>=1.14.0",
    "caldav>=3.2.1",
    "fastapi>=0.141.1",
    # monarchmoney 0.1.15 declares gql>=3.4 but calls the gql 3.x
    # execute_async(document=..., operation_name=..., variable_values=...)
    # signature; gql 4.0 replaced it with a single GraphQLRequest arg, so
    # every Monarch call died with "missing 1 required positional argument:
    # 'request'". Drop this when monarchmoney ships a gql 4 release.
    "gql<4",
    "google-api-python-client>=2.199.0",
    "google-auth-oauthlib>=1.4.0",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "langchain>=1.3.16",
    "langchain-openai>=1.5.1",
    # 4.0 is the floor, not a lower, never-tested bound: the v2->v3+ SDK was
    # restructured around OpenTelemetry, and 4.15.0 (what uv.lock actually
    # resolves) is what this repo is tested against.
    "langfuse>=4.0.0",
    "langgraph>=1.2.11",
    "mcp>=2.0.0",
    "monarchmoney>=0.1.15",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.52.3",
]


[project.scripts]
eve-eval = "eve.eval.cli:main"
eve-migrate = "eve.memory.db:main"
eve-pat = "eve.pat:main"
eve-skill = "eve.skills.cli:main"
eve-tool = "eve.tools_authoring.cli:main"
eve-wardrobe = "eve.wardrobe.cli:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]
# claude-agent-sdk bundles a ~94MB `claude` CLI binary that only
# eve-computer's image needs (ADR 0010: eve-sandbox's whole security
# argument rests on its image containing nothing beyond what it needs). Kept
# out of the main `dependencies` list so the other four Dockerfiles' shared
# `uv sync --frozen --no-dev --no-install-project` never pulls it in.
computer = [
    "claude-agent-sdk>=0.2.149",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The default run is the unit tier. `-m integration` / `-m live` / `-m
# docker` on the command line replace this expression rather than adding to
# it, so the other tiers stay selectable exactly as documented.
addopts = ["-m", "not integration and not live and not docker"]
markers = [
    "integration: requires docker-compose.test.yml services",
    "live: requires real external infrastructure (the real LiteLLM proxy, or kubectl against a real cluster for tests/test_sandbox_live.py); requires EVE_LIVE_TESTS=1",
    "docker: builds and runs a real container image with the `docker` CLI (slow - a cold build is on the order of a minute); skips itself if docker is unavailable",
]
