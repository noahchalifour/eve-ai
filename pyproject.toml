[project]
name = "eve"
version = "0.1.0"
description = "Eve, a family personal assistant graph served by Aegra"
readme = "README.md"
authors = [
    { name = "Noah Chalifour", email = "chalifournoah@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aegra-api>=0.10.3",
    "aegra-cli>=0.10.3",
    "caldav>=3.2.1",
    "fastapi>=0.141.1",
    # monarchmoney 0.1.15 declares gql>=3.4 but calls the gql 3.x
    # execute_async(document=..., operation_name=..., variable_values=...)
    # signature; gql 4.0 replaced it with a single GraphQLRequest arg, so
    # every Monarch call died with "missing 1 required positional argument:
    # 'request'". Drop this when monarchmoney ships a gql 4 release.
    "gql<4",
    "google-api-python-client>=2.199.0",
    "google-auth-oauthlib>=1.4.0",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "langchain>=1.3.16",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.11",
    "mcp>=2.0.0",
    "monarchmoney>=0.1.15",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.52.3",
]


[project.scripts]
eve-migrate = "eve.memory.db:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The default run is the unit tier. `-m integration` / `-m live` on the
# command line replace this expression rather than adding to it, so the
# other two tiers stay selectable exactly as documented.
addopts = ["-m", "not integration and not live"]
markers = [
    "integration: requires docker-compose.test.yml services",
    "live: hits the real LiteLLM proxy; requires EVE_LIVE_TESTS=1",
]
