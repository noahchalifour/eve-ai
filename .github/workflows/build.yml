name: build

on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -m "not integration and not live" -v

  # Runs on every PR/push, unlike the tag-gated `image` job below: that job
  # publishes the eve-sandbox image but never asserts it actually works.
  # This builds it fresh (Docker layer caching keeps a same-deps rebuild
  # fast; a cold build is on the order of a minute) and asserts a real
  # /invoke call against the real container succeeds - the regression
  # coverage for Critical 1 (whole-branch review: `python -I` silently
  # discarding PYTHONPATH, breaking every /invoke call in the built image)
  # that test_sandbox_docker_image.py's own docstring explains no other test
  # in this suite provides, dev-checkout .pth files masking that exact bug
  # everywhere else.
  docker-image-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -m docker -v

  # Publishing stays tag-only; `test` above now runs on every PR and push.
  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: eve-ai
            dockerfile: Dockerfile
          - image: eve-tools
            dockerfile: Dockerfile.eve-tools
          - image: eve-ambient
            dockerfile: Dockerfile.eve-ambient
          - image: eve-sandbox
            dockerfile: Dockerfile.eve-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/noahchalifour/${{ matrix.image }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
