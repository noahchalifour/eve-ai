# Test-only dependencies. Uses the same Postgres image the cluster runs, so
# Phase 2's vector work is exercised on the same engine locally.
#
# Host ports are deliberately non-default (15432/16379 rather than 5432/6379):
# a test suite that only runs on a machine with the default ports free is a
# worse artifact than one that doesn't collide with whatever else is running
# locally, including CI. Container-internal ports stay standard.
services:
  postgres:
    image: ghcr.io/tensorchord/cloudnative-vectorchord:16.9-0.4.3
    environment:
      POSTGRES_DB: eve
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
    ports: ["15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
  eve-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.eve-sandbox
    environment:
      EVE_SANDBOX_API_KEY: test-key-0123456789abcdef0123456789ab
    ports: ["18092:8091"]
    healthcheck:
      test: ["CMD", "python", "-c",
              "import urllib.request as u; u.urlopen('http://localhost:8091/healthz')"]
      interval: 2s
      retries: 30
